<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>Recorrido 3D</title>
  <link rel="stylesheet" href="./src/style.css">
</head>
<body>
  <canvas id="escena" aria-label="Recorrido 3D de la propiedad"></canvas>

  <div id="carga" role="status">
    <div class="carga-caja">
      <div class="carga-titulo" id="carga-titulo">Cargando recorrido…</div>
      <div class="barra"><div class="barra-relleno" id="barra"></div></div>
      <div class="carga-texto" id="carga-texto">0 %</div>
    </div>
  </div>

  <header id="marca">
    <div class="marca-nombre" id="marca-nombre"></div>
    <div class="marca-sub" id="marca-sub"></div>
  </header>

  <nav id="ambientes" aria-label="Ambientes">
    <button id="btn-compartir" class="chip" aria-haspopup="dialog">Compartir</button>
    <button id="btn-pantalla" class="chip" hidden aria-label="Pantalla completa">⛶</button>
    <button id="btn-ambientes" class="chip" aria-expanded="false">Ambientes</button>
    <ul id="lista-ambientes" hidden></ul>
  </nav>

  <div id="modos" role="group" aria-label="Vista">
    <button class="chip activo" data-modo="recorrido">Recorrer</button>
    <button class="chip" data-modo="maqueta">Maqueta</button>
  </div>

  <div id="plantas" role="group" aria-label="Plantas" hidden>
    <button class="chip" data-corte="completa">Completa</button>
    <button class="chip" data-corte="pa">Planta alta</button>
    <button class="chip activo" data-corte="pb">Planta baja</button>
  </div>

  <div id="compartir" role="dialog" aria-modal="true" aria-labelledby="compartir-titulo" hidden>
    <div class="panel">
      <div class="panel-cab"><strong id="compartir-titulo">Compartir recorrido</strong><button class="cerrar" id="cerrar-compartir" aria-label="Cerrar">×</button></div>
      <label class="campo">Link a esta vista
        <span class="fila"><input id="txt-link" readonly><button class="chip" data-copiar="txt-link">Copiar</button></span>
      </label>
      <a id="lnk-whatsapp" class="chip whatsapp" target="_blank" rel="noopener">Enviar por WhatsApp</a>
      <label class="campo">Código para insertar en una web
        <span class="fila"><textarea id="txt-embed" rows="3" readonly></textarea><button class="chip" data-copiar="txt-embed">Copiar</button></span>
      </label>
      <a class="ayuda-embed" href="./embed-ejemplo.html" target="_blank" rel="noopener">Ver un ejemplo insertado</a>
    </div>
  </div>

  <div id="etiqueta" aria-live="polite"></div>
  <div id="ayuda">Arrastrá para mirar · tocá un círculo o caminá (W A S D)</div>
  <svg id="minimapa" aria-label="Plano con tu ubicación" role="img"></svg>
  <div id="joystick" aria-hidden="true"><div id="joy-perilla"></div></div>
  <div id="etiquetas"></div>
  <div id="carga-fondo" hidden>Cargando planta alta…</div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
